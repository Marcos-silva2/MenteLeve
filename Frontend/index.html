<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff0f3" />
  <!-- Aplica o tema salvo ANTES do primeiro render (sem flash de cor).
       Ids válidos: ver THEMES em js/theme.js. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('menteleve.theme');
        if (t && /^[a-z]+$/.test(t) && t !== 'bordeaux') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="MenteLeve — a agenda inteligente para o trabalho e a vida. Organize tarefas e compromissos com inteligência artificial." />
  <title>MenteLeve</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <!-- Fonts
       O corpo do texto usa a fonte do sistema: nada para baixar, nada que
       bloqueie a renderização, e o app se parece com um app do aparelho.

       Playfair Display fica só nos títulos — é a assinatura da marca — e
       carrega FORA do caminho crítico (media="print" até o load). O `display=swap`
       mostra o texto de imediato em Georgia e troca quando a fonte chega.
       Isso importa porque a fonte NÃO está no precache do Service Worker: no
       modo offline os títulos caem em Georgia, nunca numa sans genérica. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          // As cores vêm dos canais `--rgb-*` de css/styles.css (um bloco por
          // tema), então `bg-accent/15` etc. continuam funcionando em qualquer tema.
          // O nome `bordeaux` é histórico: designa a cor de estrutura do tema ativo.
          colors: {
            bg: 'rgb(var(--rgb-bg) / <alpha-value>)',
            bordeaux: {
              900: 'rgb(var(--rgb-primary-900) / <alpha-value>)',
              800: 'rgb(var(--rgb-primary-800) / <alpha-value>)',
              700: 'rgb(var(--rgb-primary-700) / <alpha-value>)',
              600: 'rgb(var(--rgb-primary-600) / <alpha-value>)',
            },
            accent: {
              DEFAULT: 'rgb(var(--rgb-accent) / <alpha-value>)',
              hover: 'rgb(var(--rgb-accent-hover) / <alpha-value>)',
            },
            soft: {
              300: 'rgb(var(--rgb-soft-300) / <alpha-value>)',
              200: 'rgb(var(--rgb-soft-200) / <alpha-value>)',
              100: 'rgb(var(--rgb-soft-100) / <alpha-value>)',
            },
            // Texto secundário: em todos os temas dá ≥ 4,5:1 (WCAG AA) sobre o
            // fundo e sobre o branco. `soft-300` fica para decoração, não leitura.
            muted: 'rgb(var(--rgb-muted) / <alpha-value>)',
            surface: 'rgb(var(--rgb-surface) / <alpha-value>)',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          boxShadow: {
            card: '0 8px 24px rgb(var(--rgb-primary-900) / .08)',
            sheet: '0 -8px 40px rgb(var(--rgb-primary-900) / .18)',
            fab: '0 8px 24px rgb(var(--rgb-accent) / .45)',
          },
          borderRadius: {
            xl2: '1.5rem',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Shell adaptativo:
       Mobile  → conteúdo full-screen + bottom bar
       Desktop → sidebar lateral fixa (Night Bordeaux) + área de conteúdo -->
  <div id="root" class="root">
    <!-- Navegação lateral (desktop) -->
    <aside id="sidenav" class="sidenav"></aside>

    <!-- Área principal (recebe overlays: sheet/modal/toast/FAB) -->
    <div id="device" class="frame">
      <main id="app" class="app-screen"></main>
      <!-- Navegação inferior (mobile) -->
      <nav id="bottomnav" class="bottomnav"></nav>
    </div>
  </div>

  <!-- Splash "O Despertar da MenteLeve" (roteiro docs/entrada.md) — removida pelo app.js -->
  <div id="splash" class="splash" aria-hidden="true">
    <div id="splash-particles" class="splash-particles"></div>
    <div class="splash-stage">
      <!-- mesmo logo de js/ui.js, sem a faísca embutida: a splash tem a sua, animada -->
      <svg viewBox="0 0 64 64" class="splash-iso" aria-hidden="true"><rect x="6" y="10" width="52" height="48" rx="14" fill="var(--color-primary-900)"/><rect x="19" y="4" width="6" height="14" rx="3" fill="var(--color-accent)"/><rect x="39" y="4" width="6" height="14" rx="3" fill="var(--color-accent)"/><path d="M18 47C15 31 28 21 46 22C48 38 36 50 18 47Z" fill="var(--color-bg)"/><path d="M20 45C27 38 33 33 41 27" fill="none" stroke="var(--color-accent)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span class="splash-spark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.3L19 9l-5.2 1.7L12 16l-1.8-5.3L5 9l5.2-1.7L12 2z"/><circle cx="19.5" cy="4.5" r="1.3"/><circle cx="5" cy="17" r="1.1"/></svg>
      </span>
      <span class="splash-name">MenteLeve</span>
      <span class="splash-tagline">Seu Segundo Cérebro Inteligente</span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
