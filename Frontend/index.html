<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff0f3" />
  <meta name="description" content="MenteLeve — a sua mente mais leve. Gestão de carga mental com inteligência artificial." />
  <title>MenteLeve</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />

  <!-- Fonts
       O corpo do texto usa a fonte do sistema: nada para baixar, nada que
       bloqueie a renderização, e o app se parece com um app do aparelho.

       Playfair Display fica só nos títulos — é a assinatura da marca — e
       carrega FORA do caminho crítico (media="print" até o load). O `display=swap`
       mostra o texto de imediato em Georgia e troca quando a fonte chega.
       Isso importa porque a fonte NÃO está no precache do Service Worker: no
       modo offline os títulos caem em Georgia, nunca numa sans genérica. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  </noscript>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#fff0f3',
            bordeaux: { 900: '#590d22', 800: '#800f2f', 700: '#a4133c', 600: '#c9184a' },
            accent: { DEFAULT: '#ff4d6d', hover: '#ff758f' },
            soft: { 300: '#ff8fa3', 200: '#ffb3c1', 100: '#ffccd5' },
            // Texto secundário. O rosa `soft-300` vinha fazendo esse papel e
            // rende 1,96:1 sobre o fundo do app — abaixo dos 4,5:1 do WCAG AA,
            // em rótulos de 10-11px e na navegação inferior. Este bordô
            // dessaturado dá 4,90:1 sobre o fundo e 5,41:1 sobre o branco,
            // e continua bem mais leve que o `bordeaux-900` do texto principal.
            // `soft-300` fica para o que é decoração, não leitura.
            muted: '#836169',
            surface: '#ffffff',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
          },
          boxShadow: {
            card: '0 8px 24px rgba(89,13,34,.08)',
            sheet: '0 -8px 40px rgba(89,13,34,.18)',
            fab: '0 8px 24px rgba(255,77,109,.45)',
          },
          borderRadius: {
            xl2: '1.5rem',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Shell adaptativo:
       Mobile  → conteúdo full-screen + bottom bar
       Desktop → sidebar lateral fixa (Night Bordeaux) + área de conteúdo -->
  <div id="root" class="root">
    <!-- Navegação lateral (desktop) -->
    <aside id="sidenav" class="sidenav"></aside>

    <!-- Área principal (recebe overlays: sheet/modal/toast/FAB) -->
    <div id="device" class="frame">
      <main id="app" class="app-screen"></main>
      <!-- Navegação inferior (mobile) -->
      <nav id="bottomnav" class="bottomnav"></nav>
    </div>
  </div>

  <!-- Splash "O Despertar da MenteLeve" (roteiro docs/entrada.md) — removida pelo app.js -->
  <div id="splash" class="splash" aria-hidden="true">
    <div id="splash-particles" class="splash-particles"></div>
    <div class="splash-stage">
      <img class="splash-iso" src="assets/isotipo.webp" alt="" draggable="false" />
      <span class="splash-spark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.3L19 9l-5.2 1.7L12 16l-1.8-5.3L5 9l5.2-1.7L12 2z"/><circle cx="19.5" cy="4.5" r="1.3"/><circle cx="5" cy="17" r="1.1"/></svg>
      </span>
      <span class="splash-name">MenteLeve</span>
      <span class="splash-tagline">Seu Segundo Cérebro Inteligente</span>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
